# A contributing guide says how to run the tests, so a contributor can
# check a change before sending it. A link to the testing guide counts.
extends: occurrence
message: "Nothing here says how to run the tests. Give the command."
link: https://opensource.guide/starting-a-project/#writing-your-contributing-guidelines
level: warning
scope: raw
token: '(?im)\b(?:run(?:ning)?|execute|executing) (?:the |all |any |existing |your |our )?(?:[\w-]+ )?(?:tests?|specs?)\b|\btest suite\b|\btest your changes?\b|\bpass(?:es)? (?:all )?(?:the )?tests\b|\[[^\]\n]*\btest(?:s|ing)?\b[^\]\n]*\]\s*[(\[]|\b(?:npm|yarn|pnpm|go|cargo|make|mix|rake|dotnet|mvn|gradle|gradlew|deno|bun) (?:run )?test\b|\bpytest\b|\btox\b|^(?: {0,3}#{1,6}[ \t]+)(?:[^\w\n]+)?(?:[\w ]+ )?(?:tests?|testing)\b'
min: 1

tests:
  - name: fires
    input: |
      # Contributing

      Open a pull request with your change.
    want: |
      1:1:Contributing.Tests:Nothing here says how to run the tests. Give the command.
  - name: a heading counts
    input: |
      # Contributing

      ## Regression tests

      See the scripts directory.
    want: ""
  - name: a link counts
    input: |
      # Contributing

      See [Step 7: Test](https://example.com/docs/pull-requests#step-7-test).
    want: ""
  - name: clean
    input: |
      # Contributing

      Run the tests with `make test` before you open a pull request.
    want: ""

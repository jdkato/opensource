# Standard Readme opens with the project's name as the title. A README
# whose first heading is level 2 or lower has no title, or has it in the
# wrong place.
extends: existence
message: "'%s' is the first heading. Open with a level-1 heading that names the project."
link: https://github.com/RichardLitt/standard-readme/blob/main/spec.md#title
level: warning
scope: 'doc(body > section:first-of-type > :is(h2, h3, h4, h5, h6):first-child)'
nonword: true
raw:
  - '^[^\n]+'

tests:
  - name: fires
    input: |
      ## Install

      Run the installer.
    want: |
      1:4:Readme.Title:'Install' is the first heading. Open with a level-1 heading that names the project.
  - name: a logo before the title
    input: |
      <p align="center"><img src="logo.png"></p>

      <h1 align="center">tool</h1>

      ## Install
    want: ""
  - name: clean
    input: |
      # tool

      ## Install
    want: ""

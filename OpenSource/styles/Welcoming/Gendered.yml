# "Guys" addresses a mixed group as men. Std's gendered terms are kept,
# since a welcoming guide avoids those too, except that "steward" is
# neutral; only "stewardess" is replaced.
extends: Std.Usage.GenderedTerms
link: https://opensource.guide/starting-a-project/#how-you-write-and-code-affects-your-brand-too
level: suggestion
swap+:
  you guys: you all
  hey guys: hi everyone
  hi guys: hi everyone
  guys: everyone
  stewardess: flight attendant
swap-:
  - steward(?:ess)?

tests:
  - name: fires
    input: |
      Thanks, guys. Hi guys, the chairman will review it.
    want: |
      1:9:Welcoming.Gendered:Consider 'everyone' instead of 'guys'.
      1:15:Welcoming.Gendered:Consider 'hi everyone' instead of 'Hi guys'.
      1:28:Welcoming.Gendered:Consider 'chair' instead of 'chairman'.
  - name: steward
    input: |
      The release steward signs the build.
    want: ""
  - name: clean
    input: |
      Thanks, everyone. The chair will review it.
    want: ""

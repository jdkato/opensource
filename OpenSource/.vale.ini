# Each style reads one kind of file, chosen by its name: Readme for
# README.md and Contributing for CONTRIBUTING.md, wherever they are.
# Welcoming reads both.
#
# Std is the standard library Welcoming.Gendered extends; sync pulls it in,
# and it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[**/README.md]
BasedOnStyles = Readme, Welcoming

[**/CONTRIBUTING.md]
BasedOnStyles = Contributing, Welcoming
